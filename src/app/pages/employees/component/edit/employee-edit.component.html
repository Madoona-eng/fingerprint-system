<section class="employee-edit-page">
  <!-- الزرار في البداية -->
  <button type="button" class="back-btn page-back-btn" (click)="cancel.emit()">
    <mat-icon>arrow_forward</mat-icon>
    <span>رجوع للقائمة</span>
  </button>

  <div class="employee-edit-shell">
    <div class="employee-edit-form-wrap">
      <app-employee-form
        [employeeForm]="employeeForm"
        [selectedEmployeeId]="selectedEmployeeId"
        [isSaving]="isSaving"
        [successMessage]="successMessage"
        [errorMessage]="errorMessage"
        [departmentOptions]="departmentOptions"
        [hideNotes]="true"
        (submitForm)="submitForm.emit()"
        (cancel)="cancel.emit()"
      ></app-employee-form>
    </div>
  </div>
</section>
