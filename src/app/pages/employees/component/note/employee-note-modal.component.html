<div class="modal-backdrop" *ngIf="show">
  <div class="modal-card" role="dialog" aria-modal="true">
    <h3 class="modal-title">إضافة ملاحظة للموظف</h3>
    <p class="modal-text">{{ employeeName || 'الموظف' }}</p>

    <label class="note-label" for="employee-note-input">نص الملاحظة</label>
    <textarea
      id="employee-note-input"
      class="note-textarea"
      rows="4"
      placeholder="اكتبي نص الملاحظة هنا..."
      [(ngModel)]="draftNote"
      [ngModelOptions]="{ standalone: true }"
    ></textarea>

    <div class="modal-actions">
      <button type="button" class="table-action-btn confirm-action" (click)="confirmNote()">حفظ</button>
      <button type="button" class="table-action-btn cancel-action" (click)="cancel.emit()">إلغاء</button>
    </div>
  </div>
</div>
