<div class="reports-page" dir="rtl">
  <!-- هيدر الفلاتر والبحث -->
  <section class="reports-hero-card">
    <div>
      <h1>تحليل بيانات الحضور والانصراف</h1>
    </div>

    <div class="reports-filter-box">
      <div class="filter-field">
        <label>التاريخ</label>
        <div class="date-input-wrap">
          <input
            type="text"
            class="date-text-input"
            inputmode="numeric"
            maxlength="10"
            placeholder="31/03/2026"
            [(ngModel)]="analyticsDateDisplay"
            [ngModelOptions]="{ standalone: true }"
            (input)="formatAnalyticsDateWhileTyping()"
          />

          <button
            type="button"
            class="calendar-btn"
            (click)="openAnalyticsDatePicker(analyticsDatePicker)"
          >
            📅
          </button>

          <input
            #analyticsDatePicker
            class="native-date-picker"
            type="date"
            [value]="analyticsDate"
            (change)="onAnalyticsNativeDatePicked($event)"
          />
        </div>
      </div>

      <div class="filter-field" *ngIf="isSuperAdminUser">
        <label>الموقع</label>
        <select
          [(ngModel)]="selectedLocationId"
          [ngModelOptions]="{ standalone: true }"
          (ngModelChange)="onLocationChange($event)"
        >
          <option [ngValue]="null">كل المواقع</option>
          <option *ngFor="let loc of locationOptions" [ngValue]="loc.id">
            {{ loc.name }}
          </option>
        </select>
      </div>

      <button
        mat-flat-button
        type="button"
        class="btn-apply"
        [disabled]="isLoading"
        (click)="loadAnalytics()"
      >
        <mat-icon>filter_alt</mat-icon>
        {{ isLoading ? 'جاري التحميل...' : 'تطبيق الفلترة' }}
      </button>

      <button mat-stroked-button type="button" class="btn-clear" (click)="clearAnalytics()">
        <mat-icon>filter_alt_off</mat-icon>
        مسح الفلترة
      </button>

      <button
        mat-flat-button
        type="button"
        class="btn-export"
        [disabled]="isLoading || !analyticsDate"
        (click)="exportSummaryToExcel()"
      >
        <mat-icon>table_view</mat-icon>
        تصدير إكسيل
      </button>
    </div>
  </section>

  <!-- رسائل الخطأ والنجاح -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <!-- جدول ملخص الإحصائيات -->
  <section class="summary-table-card">
    <div class="table-wrapper">
      <table class="summary-table">
        <thead>
          <tr>
            <th>الإحصائية</th>
            <th>القيمة</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of statSummaryRows">
            <td>{{ row.label }}</td>
            <td>
              <strong [class]="row.cssClass">{{ row.value }}</strong>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
