<div class="dashboard-layout" dir="rtl">
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-logo">
      <div class="sidebar-title">
        <h2>نظام البصمة</h2>
        <p>لوحة التحكم</p>
      </div>
      <button
        type="button"
        class="sidebar-toggle"
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar"
        [matTooltip]="isSidebarCollapsed ? 'اضغط للفتح' : 'اضغط للقفل'"
        matTooltipPosition="below"
      >
        {{ isSidebarCollapsed ? '⬅️' : '➡️' }}
      </button>
    </div>

    <nav class="sidebar-menu">
      <a
        routerLink="/dashboard/employees"
        routerLinkActive="active"
        [matTooltip]="isSidebarCollapsed ? 'الموظفين' : ''"
        matTooltipPosition="left"
      >
        <span>👥</span>
        <b>الموظفين</b>
      </a>

      <a
        routerLink="/dashboard/attendance"
        routerLinkActive="active"
        [matTooltip]="isSidebarCollapsed ? 'الحضور والانصراف' : ''"
        matTooltipPosition="left"
      >
        <span>⏱️</span>
        <b>الحضور والانصراف</b>
      </a>

      @if (userRole.toLowerCase() === 'superadmin') {
        <a
          routerLink="/dashboard/fingerprint-sheet"
          routerLinkActive="active"
          [matTooltip]="isSidebarCollapsed ? 'شيت البصمة' : ''"
          matTooltipPosition="left"
        >
          <span>🖨️</span>
          <b>شيت البصمة</b>
        </a>
      }

      <a
        routerLink="/dashboard/reports"
        routerLinkActive="active"
        [matTooltip]="isSidebarCollapsed ? 'عرض التقرير' : ''"
        matTooltipPosition="left"
      >
        <span>📊</span>
        <b>عرض التقرير</b>
      </a>
      </nav>

    @if (!isSidebarCollapsed) {
      <button mat-fab extended color="warn" class="logout-btn" type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        تسجيل الخروج
      </button>
    } @else {
      <button
        mat-mini-fab
        color="warn"
        class="logout-btn-collapsed"
        type="button"
        (click)="logout()"
        matTooltip="تسجيل الخروج"
        matTooltipPosition="left"
      >
        <mat-icon>logout</mat-icon>
      </button>
    }

  </aside>

  <section class="main-area" [class.collapsed]="isSidebarCollapsed">
    <header class="topbar">
      <div>
        <h2>مرحباً بك {{ userName }} 👋</h2>
        <p>إدارة نظام البصمة الإلكتروني</p>
      </div>

      <span class="role-badge">{{ userRole }}</span>
    </header>

    <main class="page-content">
      <section class="dashboard-overview" aria-label="عرض شيت البصمة"></section>

      <router-outlet></router-outlet>
    </main>
  </section>
</div>
