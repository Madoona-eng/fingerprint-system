<div class="attendance-page" dir="rtl">
  <!-- ==========================================
       الهيدر العام لصفحة الحضور والانصراف
  ========================================== -->
  <section class="attendance-card">
    <div class="upload-info">
      <h1>الحضور والانصراف</h1>
      <p>استيراد شيت الحضور، عرض سجلات الحضور والانصراف، ومراجعة ملخص التأخير.</p>
    </div>
  </section>

  <!-- ==========================================
       أزرار التابات (رفع Excel / عرض السجلات / ملخص التأخير)
  ========================================== -->
  <section class="attendance-page-tabs">
    <button
      type="button"
      class="tab-import"
      [class.active]="activeAttendancePage === 'import'"
      (click)="openAttendancePage('import')"
    >
      📁 رفع Excel
    </button>

    <button
      type="button"
      class="tab-report"
      [class.active]="activeAttendancePage === 'report'"
      (click)="openAttendancePage('report')"
    >
      📊 عرض السجلات
    </button>

    <button
      type="button"
      class="tab-late-summary"
      [class.active]="activeAttendancePage === 'lateSummary'"
      (click)="openAttendancePage('lateSummary')"
    >
      ⏱️ ملخص التأخير
    </button>
  </section>

  <ng-container [ngSwitch]="activeAttendancePage">
    <section *ngSwitchCase="'import'" class="attendance-sub-page">
      <app-attendance-import
        [excelFileName]="excelFileName"
        [successMessage]="successMessage"
        [errorMessage]="errorMessage"
        [rowErrors]="rowErrors"
        [sheetPreviewRows]="sheetPreviewRows"
        [sheetPreviewHeaders]="sheetPreviewHeaders"
        [attendanceRowsLength]="attendanceRows.length"
        [isImporting]="isImporting"
        [hasImportedCurrentSheet]="hasImportedCurrentSheet"
        (fileSelected)="onAttendanceSheetSelected($event)"
        (importAttendance)="importAttendance()"
        (clearData)="clearData()"
      ></app-attendance-import>
    </section>

    <section *ngSwitchCase="'report'" class="attendance-sub-page">
      <app-attendance-report
        [dateRangeFrom]="dateRangeFrom"
        [dateRangeTo]="dateRangeTo"
        [dateRangeFromDisplay]="dateRangeFromDisplay"
        [dateRangeToDisplay]="dateRangeToDisplay"
        [employeeSearchTerm]="employeeSearchTerm"
        [selectedLocationId]="selectedLocationId"
        [dateRangeDepartmentId]="dateRangeDepartmentId"
        [dateRangeStatus]="dateRangeStatus"
        [dateRangeNeedsReview]="dateRangeNeedsReview"
        [statusOptions]="statusOptions"
        [dateRangeRoute]="dateRangeRoute"
        [routeOptions]="routeOptions"
        [filteredDateRangeRows]="filteredDateRangeRows"
        [dateRangePageNumber]="dateRangePageNumber"
        [dateRangeTotalPages]="dateRangeTotalPages"
        [dateRangeTotalCount]="dateRangeTotalCount"
        [isLoadingDateRange]="isLoadingDateRange"
        [dateRangeErrorMessage]="dateRangeErrorMessage"
        [dateRangeSuccessMessage]="dateRangeSuccessMessage"
        [notesModalOpen]="notesModalOpen"
        [notesModalTitle]="notesModalTitle"
        [notesModalEntries]="notesModalEntries"
        [reviewingAttendanceId]="reviewingAttendanceId"
        [isSuperAdmin]="isSuperAdmin"
        [locations]="locations"
        [departmentOptions]="departmentOptions"
        (dateRangeInputChange)="onDateRangeInputChange($event.value, $event.field)"
        (openNativeDatePicker)="openNativeDatePicker($event)"
        (nativeDatePicked)="onNativeDatePicked($event.event, $event.field)"
        (applyDateRangeFilter)="applyDateRangeFilter()"
        (clearDateRangeFilter)="clearDateRangeFilter()"
        (exportAttendanceReportToExcel)="exportAttendanceReportToExcel()"
        (previousDateRangePage)="previousDateRangePage()"
        (nextDateRangePage)="nextDateRangePage()"
        (onEmployeeSearchInputChange)="onEmployeeSearchInputChange()"
        (employeeSearchTermChange)="employeeSearchTerm = $event"
        (dateRangeNeedsReviewChange)="dateRangeNeedsReview = $event"
        (markAttendanceReviewed)="markAttendanceReviewed($event)"
        (openAttendanceEdit)="openAttendanceEdit($event)"
        (openNotesModal)="openNotesModal($event)"
        (closeNotesModal)="closeNotesModal()"
        (onLocationChange)="onLocationChange($event)"
        (dateRangeDepartmentIdChange)="dateRangeDepartmentId = $event"
        (dateRangeStatusChange)="dateRangeStatus = $event"
        (dateRangeRouteChange)="dateRangeRoute = $event"
      ></app-attendance-report>
    </section>

    <section *ngSwitchCase="'lateSummary'" class="attendance-sub-page">
      <app-attendance-late-summary
        [lateSummaryFrom]="lateSummaryFrom"
        [lateSummaryTo]="lateSummaryTo"
        [lateSummaryFromDisplay]="lateSummaryFromDisplay"
        [lateSummaryToDisplay]="lateSummaryToDisplay"
        [lateSummaryEmployeeSearch]="lateSummaryEmployeeSearch"
        [lateSummaryLocationId]="lateSummaryLocationId"
        [lateSummaryDepartmentId]="lateSummaryDepartmentId"
        [lateSummaryRows]="lateSummaryRows"
        [lateSummaryData]="lateSummaryData"
        [lateSummaryPageNumber]="lateSummaryPageNumber"
        [lateSummaryTotalPages]="lateSummaryTotalPages"
        [lateSummaryErrorMessage]="lateSummaryErrorMessage"
        [lateSummarySuccessMessage]="lateSummarySuccessMessage"
        [isLoadingLateSummary]="isLoadingLateSummary"
        [isSuperAdmin]="isSuperAdmin"
        [locations]="locations"
        [departmentOptions]="departmentOptions"
        (lateSummaryFromDisplayChange)="onLateSummaryDateInputChange($event, 'from')"
        (lateSummaryToDisplayChange)="onLateSummaryDateInputChange($event, 'to')"
        (lateSummaryEmployeeSearchChange)="lateSummaryEmployeeSearch = $event"
        (lateSummarySearchInput)="onLateSummarySearchInput()"
        (lateSummaryLocationIdChange)="lateSummaryLocationId = $event; onLateSummaryLocationOrDepartmentChange()"
        (lateSummaryDepartmentIdChange)="lateSummaryDepartmentId = $event; onLateSummaryLocationOrDepartmentChange()"
        (loadLateSummary)="loadLateSummary()"
        (clearLateSummary)="clearLateSummary()"
        (exportLateSummaryToExcel)="exportLateSummaryToExcel()"
        (onLocationChange)="onLocationChange($event)"
        (openNativeDatePicker)="openNativeDatePicker($event)"
        (nativeDatePicked)="onLateSummaryNativeDatePicked($event.event, $event.field)"
        (previousLateSummaryPage)="previousLateSummaryPage()"
        (nextLateSummaryPage)="nextLateSummaryPage()"
      ></app-attendance-late-summary>
    </section>

    <section *ngSwitchCase="'edit'" class="attendance-sub-page">
      <app-attendance-edit
        [attendanceEditEmployeeCode]="attendanceEditEmployeeCode"
        [attendanceEditEmployeeName]="attendanceEditEmployeeName"
        [attendanceEditDepartmentName]="attendanceEditDepartmentName"
        [attendanceEditDate]="attendanceEditDate"
        [attendanceEditStatus]="attendanceEditStatus"
        [attendanceEditNotes]="attendanceEditNotes"
        [attendanceEditErrorMessage]="attendanceEditErrorMessage"
        [attendanceEditSuccessMessage]="attendanceEditSuccessMessage"
        [isSavingAttendanceEdit]="isSavingAttendanceEdit"
        [statusOptions]="statusOptions"
        (attendanceEditStatusChange)="attendanceEditStatus = $event"
        (attendanceEditNotesChange)="attendanceEditNotes = $event"
        (saveAttendanceEdit)="saveAttendanceEdit()"
        (cancelAttendanceEdit)="cancelAttendanceEdit()"
      ></app-attendance-edit>
    </section>
  </ng-container>
</div>
